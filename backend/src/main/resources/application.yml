spring:
  application:
    name: dronistas
  servlet:
    multipart:
      max-file-size: 8300MB
      max-request-size: 8300MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dronistas}
    username: ${DB_USER:dronistas}
    password: ${DB_PASSWORD:dronistas}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  type-aliases-package: com.dronistas.model
  type-handlers-package: com.dronistas.config
  configuration:
    map-underscore-to-camel-case: true

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:us-east-2}
    bucket: ${AWS_BUCKET_NAME:}

app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-com-256-bits-minimo}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
